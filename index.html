<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>如果降雨数据变成雨 · Rainfall Data as Rain</title>
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- 左上角场景标题 -->
  <div id="scene-title">
    <div class="t1">降雨强度</div>
    <div class="t2">每小时降水</div>
    <div class="t3">毫米/小时</div>
  </div>

  <!-- 右上角当前读数 -->
  <div id="hud">
    <div class="bar"></div>
    <div class="right">
      <div class="time" id="hud-time">00:00</div>
      <div class="value-row">
        <span class="value" id="hud-value">0.0</span>
        <span class="unit">毫米/小时</span>
      </div>
    </div>
  </div>

  <!-- 左侧数据面板 -->
  <aside id="panel">
    <div class="panel-head">
      <span class="title">编辑降雨数据</span>
      <button class="close" id="panel-close" title="收起">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M1.5 1.5L10.5 10.5M10.5 1.5L1.5 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="chart-block">
      <div class="c-title">降雨强度</div>
      <div class="c-sub">每小时降水 · 毫米/小时</div>
      <svg id="rain-chart" preserveAspectRatio="none"></svg>
    </div>

    <div class="table-block">
      <div class="table-head">
        <span class="tb-title" id="table-title">精确模拟 26 个时间点</span>
        <span class="tb-badge">mm/h</span>
      </div>
      <div id="data-grid"></div>
    </div>
  </aside>

  <button id="panel-toggle">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
      <path d="M1.5 3.5H8M11 3.5h1.5M1.5 10.5h1.5M6 10.5h6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="9.5" cy="3.5" r="1.6" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="4.5" cy="10.5" r="1.6" stroke="currentColor" stroke-width="1.2"/>
    </svg>
    编辑降雨数据
  </button>

  <div id="hint">DRAG TO ORBIT · 拖拽旋转视角</div>

  <script type="module" src="./main.js"></script>
</body>
</html>
